version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: birzhaepta_db
    environment:
      POSTGRES_DB: birzhaepta
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: b!rzha%pta-spkteam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: birzhaepta_backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/birzhaepta
      SPRING_DATASOURSE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: b!rzha%pta-spkteam

volumes:
  postgres_data:
