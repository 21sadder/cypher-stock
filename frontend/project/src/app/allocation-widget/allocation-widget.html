<div class="allocation-widget-container">
  <div class="chart-section">
    <div class="chart-canvas-container">
      <canvas id="allocationChart"></canvas>
      <div class="center-text">
        <span class="total-assets-count">{{ this.totalAssets }}</span>
        <span class="assets-label">assets</span>
      </div>
    </div>
  </div>

  <div class="legend-section">
    <div *ngIf="this.legendData.length === 0" class="no-data-message">
      Немає даних для відображення.
    </div>
    <div *ngFor="let item of this.legendData" class="legend-item">
      <div class="legend-color-box" [style.background-color]="item.color"></div>
      <span class="legend-symbol">{{ item.symbol }}</span>
      <span class="legend-percentage">{{ item.percentage | number:'1.2-2' }}%</span>
    </div>
  </div>
</div>
