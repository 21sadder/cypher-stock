<div class="allocation-widget-container">
  <div class="allocation-title">Allocation</div>

  <div class="chart-section">
    <div class="chart-canvas-container">
      <canvas #chartCanvas></canvas>
      <div class="center-text">
        <span class="total-assets-count">{{ totalAssets }}</span>
        <span class="assets-label">assets</span>
      </div>
    </div>
  </div>

  <div class="legend-section">
    <div *ngIf="legendData.length === 0" class="no-data-message">
      No data yet
    </div>
    @for(item of legendData; track item.symbol) {
      <div class="legend-item">
        <div class="legend-dot" [style.background-color]="item.color"></div>
        <span class="legend-symbol">{{ item.symbol }}</span>
        <span class="legend-percentage">{{ item.percentage | number:'1.0-0' }}%</span>
      </div>
    }
  </div>
</div>
