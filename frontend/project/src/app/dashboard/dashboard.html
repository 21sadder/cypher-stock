<div class="dashboard-container">

  <div class="chart-card">
    <p class="up-title">Total Portfolio Value</p>
    <div class="actual-price-block">
      <h1 class="price">${{ formatted }}</h1>
      <span class="price-delta-day-percents">+{{ priceChangingDayPercents }}% (24h)</span>
    </div>
    <p class="price-delta-day-money">+${{ formattedPrice }} today</p>
  </div>

  <div class="cards-stats-allocation">
    <div class="stats-card">
      <p class="up-title">Quick Stats</p>
    </div>

    <div class="allocation">
      <p class="up-title">Allocation</p>
    </div>
  </div>
</div>
