<div class="dashboard-container">

  <div class="chart-card">
    <p class="up-title">Total Portfolio Value</p>
    <div class="actual-price-block">
      <h1 class="price">${{ loadPriceOfPortfolios() | number: '1.2-2' }}</h1>
      <span class="price-delta-day-percents">+{{ priceChangingDayPercents }}% (24h)</span>
    </div>
    <p class="price-delta-day-money">+${{ formattedPrice }} today</p>
  </div>

  <div class="cards-stats-allocation">
    <div class="stats-card">
      <p class="up-title">Quick Stats</p>
      <div class="stats">
        <p>Total P&L</p>
        <p>+$38 420,11</p>
      </div>
      <hr class="line">
      <div class="stats">
        <p>ROI</p>
        <p>+44.7%</p>
      </div>
      <hr class="line">
      <div class="stats">
        <p>Best Asset</p>
        <p>SOL +12.7%</p>
      </div>
      <hr class="line">
      <div class="stats">
        <p>Worst Asset</p>
        <p>XRP -3.4%</p>
      </div>
      <hr class="line">
      <div class="stats">
        <p>Assets</p>
        <p>Commodity, Stocks</p>
      </div>
      <hr class="line">
      <div class="stats">
        <p>24h Volume</p>
        <p>$14 230</p>
      </div>
      <hr class="line">
    </div>

    <div class="allocation">
      <p class="up-title">Allocation</p>
    </div>
  </div>
</div>
