<h1>Dashboard</h1>

<div>
  <h2>Your balance</h2>
  <p>123,456.78$</p>
</div>

<div>
  <h2>Market</h2>
  <table>
    <thead>
    <tr>
      <th>Coin</th>
      <th>Price</th>
    </tr>
    </thead>
    <tbody>
      @for (coin of cryptoData; track coin.symbol) {
        <tr>
          <td>{{ coin.symbol }}</td>
          <td>{{ coin.price | number: '1.2-2' }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="2">Очікування даних...</td>
        </tr>
      }
    </tbody>

  </table>
</div>
