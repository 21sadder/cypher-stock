<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">


<div class = "navbar">
  <div class="nav-left">
    <div class="logo">₿</div>
    <span>Cipher</span>

    <nav class="menu">
      <a routerLink="/dashboard" routerLinkActive="active">
        <img src="/icons/building-blocks-lego-toy-svgrepo-com.svg" alt="" />
        Overview</a>
      <a routerLink="/markets" routerLinkActive="active">
        <img src="/icons/arrow-up-right-lg-svgrepo-com.svg" alt="" />
        Markets</a>
      <a routerLink="/trade" routerLinkActive="active">
        <img src="/icons/lightning-svgrepo-com.svg" alt="" />
        Trade</a>
      <a routerLink="/portfolios" routerLinkActive="active">
        <img src="/icons/money-wallet-line-svgrepo-com.svg" alt="" />
        Portfolio</a>
    </nav>
  </div>

  <div class="nav-right">
    @if (selectedCoin){
      <div class="balance">₿ ${{ selectedCoin.price | number:"1.2-4" }} <span [style.color]="selectedCoin.change24h > 0 ? 'green' : 'red'">
        {{ selectedCoin.change24h >= 0 ? '+' : '' }}{{ selectedCoin.change24h | number:"1.2-2" }}%</span></div>
    } @else {
      <p>loading data for btcusdt...</p>
    }

    <button class="userBlock" (click)="toggleDropdown()">
      <div class="user">{{ initials }}</div>
      <div>{{ username }}</div>
      <img src="/icons/arrow-down-339-svgrepo-com.svg" width="14" height="14" />
    </button>

    @if (isOpen) {
      <div class="dropdown" >
        <div class="dropdown-content">
          <a class="item logout" (click)="logout()">🚪 Sign Out</a>
        </div>
      </div>
    }



  </div>
</div>

<router-outlet></router-outlet>
