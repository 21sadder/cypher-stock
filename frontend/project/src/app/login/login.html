<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap" rel="stylesheet">

<div class="form-side">
  <form  (ngSubmit) = "login()" #regForm="ngForm">
    <h2>Cipher</h2>
    <h3>Login to your account</h3>

    <input type = "email" placeholder="example@gmail.com" [(ngModel)]="email" name="email" required>
    <!-- ? - if showPassword TRUE show text, else if showPassword FALSE show password -->


    <div class="input-container">
      <input
        [type]="showPasswordLogin ? 'text' : 'password'"
        class="dark-input"
        placeholder="Enter your password"
        [(ngModel)] = "password"
        name = "password"
        required
      >
      <button type="button" class="eye-btn" (click)="showHidePasswordLogin()">
        @if (showPasswordLogin) {
          <img src="/openedEye.png" class="eye-image">
        } @else {
          <img src="/closedEye.png" class="eye-image">
        }
      </button>
    </div>


    <!-- Terms & Conditions checkbox-->
    <label class="checkbox">
      <input type="checkbox" required>
      I agree &nbsp;<span class="green-text"> Terms & Conditions *</span>
    </label>

    <button type = "submit">Login</button>

  </form>
</div>
