<div class="trade-section">

  <div class="selected-token">
    <img [src]="'https://cdn.jsdelivr.net/gh/atomiclabs/cryptocurrency-icons/128/color/' + actualSymbol.replace('USDT','').toLowerCase() + '.png'"
    class="coin-icon">
    <div class="symbol">
      <p class="actual-symbol">{{ actualSymbol }}/USDT</p>
      <p class="type-of-symbol">Crypto</p>
    </div>
    <div class="coin-price">
      <p class="price-usdt">75.323,23</p>
      <p class="price-usd">$75.323,23</p>
    </div>
  </div>

  <div class="all-actives">
    <p>List of activies</p>
    <div class="tabs">
      <button
        [class.active]="activeTab === 'All'"
        (click)="setTab('All')">
        All
      </button>
      <button
        [class.active]="activeTab === 'CRYPTO'"
        (click)="setTab('CRYPTO')">
        Crypto
      </button>
      <button
        [class.active]="activeTab === 'STOCK'"
        (click)="setTab('STOCK')">
        Stock
      </button>
      <button
        [class.active]="activeTab === 'FOREX'"
        (click)="setTab('FOREX')">
        Forex
      </button>
      <button
        [class.active]="activeTab === 'COMMODITY'"
        (click)="setTab('COMMODITY')">
        Commodity
      </button>
    </div>

    <div class="actives-list">
      @for(item of activeData; track item.symbol){
        <div>
          {{ item.symbol }} - {{ item.price }}
        </div>
      }
    </div>
  </div>
