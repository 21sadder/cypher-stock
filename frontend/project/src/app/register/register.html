<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap" rel="stylesheet">

<div class="register-container">
  <div class="brand-side">
    <h1>Cipher</h1>
    <p class="subtitle">Feature of finance.<br>Secure. Protect.</p>
  </div>

  <div class="form-side">
    <form  (ngSubmit) = "register()" #regForm="ngForm">
      <h2>Cipher</h2>
      <h3>Create account</h3>
      <p>Start your trip to world of digital assets</p>

      <input type = "text" placeholder="Username" [(ngModel)]="username" name="username" required>
      <input type = "email" placeholder="example@gmail.com" [(ngModel)]="email" name="email" required>
      <input type = "password" placeholder="Enter your password" [(ngModel)] = "password" name = "password" required>
      <input type = "password" placeholder="Enter your password one more time" [(ngModel)] = "confirmPassword"  name = "confirmPassword" required>

      <label class = "checkbox">
        <input type = "checkbox" required> Terms & Conditions *
      </label>


      <p>Do you already have an account?
        <a (click)="openLoginModal()">Log In</a>
      </p>

      @if (isModalOpen) {
        <div class="modal-overlay" (click)="closeModal()"> <!-- бзаовая настройка, если пользователь нажемет мимо окна - окно закроется -->

          <div class="modal-card" (click)="$event.stopPropagation()"> <!-- базовая настройка, не передает действия на окне фону, что бы окно не закрывалось -->

            <button class="close-btn" (click)="closeModal()">&times;</button> <!-- крестик в углу -->

            <app-login></app-login>

          </div>
        </div>
      }

      <button type = "submit">Register</button>
    </form>
  </div>
</div>
